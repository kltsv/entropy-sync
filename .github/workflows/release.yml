name: Verify and release
on:
  push:
    branches: [main]
    tags: ['[0-9]*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel, ubuntu-24.04, ubuntu-24.04-arm, windows-2022]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dart-lang/setup-dart@v1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node tool/checkout-history.mjs
      - run: python compile.py
      - run: dart pub get && dart analyze && dart test
        working-directory: packages/entropy_sync
      - run: dart pub get && dart analyze && dart test
        working-directory: packages/entropy_daemon
      - run: npm test && npm run build && npm run release:native
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.runner }}
          path: dist/native/*
          if-no-files-found: error
  release:
    needs: native
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: .artifacts/native
          merge-multiple: true
      - run: npm ci
      - run: npm run release:assemble
      - uses: actions/upload-artifact@v4
        with:
          name: brat-release
          path: dist/release/*
      - name: Publish immutable release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release already exists; keeping its assets unchanged."
          else
            gh release create "$GITHUB_REF_NAME" dist/release/* --draft --verify-tag --generate-notes
            gh release edit "$GITHUB_REF_NAME" --draft=false
          fi
